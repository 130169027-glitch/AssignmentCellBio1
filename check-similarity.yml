name: Check Submission Similarity

# Runs every time a pull request adds/changes a file in submissions/,
# and posts the similarity report as a comment on that PR.

on:
  pull_request:
    paths:
      - "submissions/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  similarity-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run similarity check
        run: python scripts/check_similarity.py --threshold 0.75 > report.txt

      - name: Post report as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const body = `### 🔍 Submission similarity check\n\n${report}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
